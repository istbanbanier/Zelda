# Coursier d'assets CC0 (AD-001 rouvert par l'utilisateur le 2026-08-05 :
# « ajoute tout ce qui pourrait avoir un intérêt, et télécharge-les toi »).
#
# Le conteneur de développement ne peut RIEN télécharger (proxy : kenney.nl,
# quaternius.com, polyhaven, opengameart → bloqués) ; le runner GitHub, lui,
# a accès. Ce workflow sonde une liste de packs CC0 candidats, conserve les
# fichiers de licence livrés avec, élague les formats redondants, et pousse
# dans `source_assets/external/` — qui n'est PAS le build : la promotion vers
# `assets/` reste manuelle, après lecture de la licence livrée (règle
# .claude/rules/assets.md).
name: Coursier d'assets CC0

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  courir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sonder et télécharger les packs candidats
        run: |
          set -uo pipefail
          mkdir -p /tmp/packs source_assets/external
          rapport() { echo "$1" >> /tmp/packs/RAPPORT.txt; }
          essayer() {
            local nom="$1"; local url="$2"
            echo "--- $nom : $url"
            if curl -fsSL --max-time 300 -o "/tmp/packs/$nom.zip" "$url"; then
              local taille=$(stat -c%s "/tmp/packs/$nom.zip")
              if [ "$taille" -gt 10000 ] && unzip -tq "/tmp/packs/$nom.zip" >/dev/null 2>&1; then
                mkdir -p "source_assets/external/$nom"
                unzip -q -o "/tmp/packs/$nom.zip" -d "source_assets/external/$nom"
                rapport "OK    $nom ($taille octets) <- $url"
                return 0
              fi
            fi
            rm -f "/tmp/packs/$nom.zip"
            rapport "ECHEC $nom <- $url"
            return 1
          }
          # --- KayKit (Kay Lousberg, CC0) : dépôts GitHub officiels ---
          essayer kaykit_dungeon_remastered "https://github.com/KayLousberg/KayKit-DungeonRemastered/archive/refs/heads/main.zip" \
            || essayer kaykit_dungeon_remastered "https://github.com/KayLousberg/KayKit-DungeonRemastered-Pack/archive/refs/heads/main.zip"
          essayer kaykit_adventurers "https://github.com/KayLousberg/KayKit-Adventurers/archive/refs/heads/main.zip"
          essayer kaykit_skeletons "https://github.com/KayLousberg/KayKit-Skeletons/archive/refs/heads/main.zip"
          essayer kaykit_halloween "https://github.com/KayLousberg/KayKit-Halloween/archive/refs/heads/main.zip"
          # --- Kenney (CC0) : miroirs GitHub officiels quand ils existent ---
          essayer kenney_input_prompts "https://github.com/KenneyNL/Input-Prompts/archive/refs/heads/main.zip"
          # --- Kenney direct (les URLs stables connues) ---
          essayer kenney_particle_pack "https://kenney.nl/media/pages/assets/particle-pack/c4d7b747fd-1677693518/kenney_particle-pack.zip"
          essayer kenney_ui_pack "https://kenney.nl/media/pages/assets/ui-pack/aa4ee3f26d-1699003052/kenney_ui-pack.zip"
          essayer kenney_impact_sounds "https://kenney.nl/media/pages/assets/impact-sounds/eee567e0e9-1677589014/kenney_impact-sounds.zip"
          essayer kenney_rpg_audio "https://kenney.nl/media/pages/assets/rpg-audio/aa9532b3d5-1677590159/kenney_rpg-audio.zip"
          echo "===== RAPPORT ====="
          cat /tmp/packs/RAPPORT.txt

      - name: Élaguer les formats redondants (garder gltf/glb, textures, sons, licences)
        run: |
          set -euo pipefail
          cd source_assets/external 2>/dev/null || exit 0
          # Les packs livrent souvent fbx+obj+gltf : on garde gltf/glb + png +
          # wav/ogg + docs de licence ; on élague le reste pour ne pas gonfler
          # le dépôt. Les fichiers de LICENCE ne sont JAMAIS supprimés.
          find . -type f \
            ! -iname "*.gltf" ! -iname "*.glb" ! -iname "*.bin" \
            ! -iname "*.png" ! -iname "*.jpg" ! -iname "*.svg" \
            ! -iname "*.wav" ! -iname "*.ogg" \
            ! -iname "*license*" ! -iname "*licence*" ! -iname "*.md" \
            ! -iname "*.txt" \
            -delete || true
          find . -type d -empty -delete || true
          du -sh . || true

      - name: Committer ce qui a atterri
        run: |
          set -euo pipefail
          git config user.name "asset-courier[bot]"
          git config user.email "noreply@github.com"
          git add source_assets/external
          if git diff --cached --quiet; then
            echo "aucun pack n'a atterri — rien à committer"
            exit 0
          fi
          NB=$(git diff --cached --numstat | wc -l)
          git commit -m "Coursier d'assets : packs CC0 dans source_assets/external ($NB fichiers)" \
            -m "Telecharges par le runner (le conteneur de dev n'a pas acces reseau aux sites d'assets). Chaque pack conserve son fichier de licence d'origine ; la promotion vers assets/ reste manuelle apres lecture de la licence livree (.claude/rules/assets.md). Rapport des sondes dans le journal du run."
          git push origin "${{ github.ref_name }}"
