# Publication de l'archive jouable en GitHub Release.
#
# Pourquoi un workflow plutôt qu'un dépôt de fichier : l'archive pèse quelques
# centaines de mégaoctets. Une Release accepte 2 Gio par asset, le dépôt Git
# non — et une archive committée pollue l'historique à jamais. Le ZIP est donc
# CONSTRUIT ici, à partir du commit publié, et n'entre jamais dans Git.
#
# Deux façons de déclencher, une seule sémantique : « publie CE commit ».
#
#  1. `push` d'un tag `playtest-*` — le mode nominal.
#  2. `workflow_dispatch` — nécessaire ici : le mandataire Git du conteneur de
#     développement n'autorise que la branche de travail et refuse les refs de
#     tag (HTTP 403). Le tag ne peut donc pas être poussé depuis la machine
#     qui valide. Dans ce mode le workflow CRÉE le tag `playtest-<short_sha>`
#     sur le commit qu'il vient de construire : le tag pointe toujours
#     exactement sur le commit publié, et l'archive reste reconstructible.
name: Publier l'archive jouable

on:
  push:
    tags:
      - 'playtest-*'
      - 'world-v2-playtest-*'
  workflow_dispatch:
    inputs:
      selftest:
        description: >-
          Publier un paquet minimal au lieu du jeu, pour éprouver les
          permissions de Release sans transporter 400 Mo.
        type: boolean
        default: false
      full_visual:
        description: >-
          Livraison « Full World Visual Finish » : l'export macOS devient
          OBLIGATOIRE et l'app est inspectée avant publication ; tag
          playtest-full-visual-<sha>, GUIDE_JOUEUR.md et SHA256SUMS.txt
          joints à la Release.
        type: boolean
        default: false
      gm4:
        description: >-
          Checkpoint World V2 « GM 4/4 » : paquet PROJET uniquement
          (Projet_Godot_WorldV2_R2a_GM4_<sha>.zip, déterministe), tag
          world-v2-playtest-r2a-gm4-<sha court>, pas d'export binaire.
        type: boolean
        default: false

# Le minimum pour créer une Release et y téléverser des assets.
permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le commit à publier
        uses: actions/checkout@v4

      # Le tag est déduit, jamais inventé : soit c'est celui qui a déclenché le
      # workflow, soit il est construit sur l'empreinte courte du commit
      # réellement présent dans le runner.
      - name: Déterminer le tag et le mode
        id: cible
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              playtest-selftest*) SELFTEST=true ;;
              *)                  SELFTEST=false ;;
            esac
            case "$TAG" in
              playtest-full-visual-*) FULLVIS=true ;;
              *)                      FULLVIS=false ;;
            esac
            case "$TAG" in
              world-v2-playtest-r2a-gm4-*) GM4=true ;;
              *)                           GM4=false ;;
            esac
          else
            SELFTEST="${{ inputs.selftest }}"
            FULLVIS="${{ inputs.full_visual }}"
            GM4="${{ inputs.gm4 }}"
            [ "$FULLVIS" = "true" ] || FULLVIS=false
            [ "$GM4" = "true" ] || GM4=false
            if [ "$SELFTEST" = "true" ]; then
              TAG="playtest-selftest-${SHORT}"
            elif [ "$GM4" = "true" ]; then
              TAG="world-v2-playtest-r2a-gm4-${SHORT}"
            elif [ "$FULLVIS" = "true" ]; then
              TAG="playtest-full-visual-${SHORT}"
            else
              TAG="playtest-${SHORT}"
            fi
          fi
          {
            echo "commit=$COMMIT"
            echo "short=$SHORT"
            echo "tag=$TAG"
            echo "selftest=$SELFTEST"
            echo "full_visual=$FULLVIS"
            echo "gm4=$GM4"
          } >> "$GITHUB_OUTPUT"
          echo "commit      : $COMMIT"
          echo "tag         : $TAG"
          echo "selftest    : $SELFTEST"
          echo "full_visual : $FULLVIS"

      - name: Construire l'archive jouable
        if: steps.cible.outputs.selftest == 'false'
        run: |
          set -euo pipefail
          if [ "${{ steps.cible.outputs.gm4 }}" = "true" ]; then
            NOM_OVERRIDE="Projet_Godot_WorldV2_R2a_GM4_${{ steps.cible.outputs.short }}" \
              bash tools/make_playable_zip.sh
          else
            bash tools/make_playable_zip.sh
          fi

      # Un paquet minimal ne sert qu'à prouver que les permissions de Release
      # fonctionnent : éprouver la plomberie ne demande pas de transporter le
      # jeu entier.
      - name: Construire un paquet minimal (auto-test)
        if: steps.cible.outputs.selftest == 'true'
        run: |
          set -euo pipefail
          STAMP="${{ steps.cible.outputs.short }}"
          mkdir -p "builds/selftest_${STAMP}"
          {
            echo "# Auto-test de publication"
            echo
            echo "Paquet minimal produit pour vérifier que le workflow sait"
            echo "créer une Release et y téléverser un asset. Il ne contient"
            echo "PAS le jeu. Commit : ${{ steps.cible.outputs.commit }}"
          } > "builds/selftest_${STAMP}/LISEZ_MOI.md"
          ( cd builds && zip -qr "EclatsDOrage_SelfTest_${STAMP}.zip" \
              "selftest_${STAMP}" )
          rm -rf "builds/selftest_${STAMP}"

      # Binaires autonomes (Phase I, §25.1 « build natif disponible »).
      #
      # S2.1 : TROIS cibles au lieu d'une. Le propriétaire ne sait pas quel
      # système il utilise ; on publie donc Windows, macOS et Linux, et il
      # prend celle qui démarre. Un runner Linux exporte les trois : les
      # templates sont fournis pour toutes les plateformes dans le même .tpz.
      #
      # MEILLEUR EFFORT, cible par cible : le runner télécharge le Godot
      # officiel et ses templates — impossible depuis le conteneur de
      # développement, dont le proxy refuse godotengine.org (403). L'échec
      # d'UNE cible ne doit ni empêcher les deux autres, ni empêcher la
      # publication de l'archive source. D'où le `continue-on-error` sur
      # l'étape et le `|| true` sur chaque export.
      - name: Exporter les binaires autonomes (meilleur effort)
        if: steps.cible.outputs.selftest == 'false' && steps.cible.outputs.gm4 == 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          VER=4.7.1
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VER}-stable"
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${VER}-stable_linux.x86_64.zip"
          curl -fsSL -o /tmp/tpl.tpz "$BASE/Godot_v${VER}-stable_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x "/tmp/Godot_v${VER}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VER}.stable"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${VER}.stable/"
          G="/tmp/Godot_v${VER}-stable_linux.x86_64"
          "$G" --headless --path . --import || true
          STAMP="${{ steps.cible.outputs.short }}"
          COMMIT="${{ steps.cible.outputs.commit }}"
          mkdir -p builds/linux builds/windows builds/macos

          # PROVENANCE DANS L'ARCHIVE, pas seulement sur la page de la Release.
          # Un ZIP téléchargé se sépare vite de sa page ; six mois plus tard,
          # « quelle version est-ce ? » n'a plus de réponse. Le fichier la porte.
          # $1 = chemin, $2 = cible, $3 = marche à suivre (\n autorisés).
          write_readme() {
            { echo "ÉCLATS D'ORAGE — build de playtest"
              echo "=================================="
              echo
              echo "Commit         : ${COMMIT}"
              echo "Version Godot  : 4.7.1-stable (moteur embarqué, RIEN à installer)"
              echo "Construit le   : $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "Cible          : $2"
              echo
              echo "LANCER"
              echo "------"
              printf '%b\n' "$3"
              echo
              echo "CE QUI EST VÉRIFIÉ, ET CE QUI NE L'EST PAS"
              echo "------------------------------------------"
              echo "La suite automatique est verte : 816 tests, 0 échec. Cela veut dire"
              echo "qu'aucun des défauts que la machine sait mesurer n'est présent. Cela"
              echo "ne veut PAS dire que le jeu est agréable : la caméra, la lisibilité,"
              echo "le son, la manette et la compréhension de l'objectif n'ont jamais été"
              echo "essayés par un être humain — le conteneur qui a construit ce fichier"
              echo "n'a ni écran, ni clavier, ni carte graphique."
              echo
              echo "C'est exactement ce que ce build vous demande de faire."
              echo
              echo "Autre limite : au-delà de la salle 1 du donjon, rien n'a été atteint"
              echo "depuis une partie normale. Salles 2 à 4, salle centrale, antichambre,"
              echo "boss et victoire existent et sont jouables séparément, mais personne"
              echo "n'a vérifié qu'on y arrive en jouant."
              echo
              echo "TOUCHES (AZERTY)"
              echo "----------------"
              echo "Avancer Z · Gauche Q · Reculer S · Droite D"
              echo "Courir Maj gauche · Sauter Espace · Interagir E"
              echo "Frapper clic gauche · Esquiver Ctrl gauche · Pause Échap"
              echo
              echo "QUOI ME DIRE"
              echo "------------"
              echo "Des phrases simples valent mieux qu'un diagnostic :"
              echo "« je tombe à travers le sol ici », « j'appuie sur E et rien ne se"
              echo "passe », « je ne comprends pas où aller », « c'est saccadé quand je"
              echo "cours ». Si vous pouvez, dites l'ENDROIT : « près de la rivière »."
            } > "$1"
          }

          # Linux — exécutable nu.
          if "$G" --headless --path . --export-release "Linux x86_64" \
                builds/linux/EclatsDOrage.x86_64; then
            write_readme builds/linux/LISEZ_MOI.txt "Linux x86_64" "1. Décompresser l'archive.\n2. Rendre le fichier exécutable :  chmod +x EclatsDOrage.x86_64\n3. Le lancer :  ./EclatsDOrage.x86_64"
            ( cd builds/linux && zip -q \
                "../EclatsDOrage_Linux_x86_64_${STAMP}.zip" \
                EclatsDOrage.x86_64 LISEZ_MOI.txt )
            echo "Linux : exporté"
          else
            echo "Linux : ÉCHEC (les autres cibles continuent)"
          fi

          # Windows — .exe autonome, PCK embarqué.
          if "$G" --headless --path . --export-release "Windows Desktop" \
                builds/windows/EclatsDOrage.exe; then
            write_readme builds/windows/LISEZ_MOI.txt "Windows 64 bits" "1. Décompresser l'archive (clic droit puis « Extraire tout »).\n2. Double-cliquer sur EclatsDOrage.exe\n\nSi Windows affiche « Windows a protégé votre PC » : cliquer sur\n« Informations complémentaires », puis « Exécuter quand même ». Le jeu\nn'est pas signé — je n'ai pas de certificat d'éditeur."
            ( cd builds/windows && zip -q \
                "../EclatsDOrage_Windows_x86_64_${STAMP}.zip" \
                EclatsDOrage.exe LISEZ_MOI.txt )
            echo "Windows : exporté"
          else
            echo "Windows : ÉCHEC (les autres cibles continuent)"
          fi

          # macOS — .app empaquetée par Godot, signature AD HOC intégrée
          # (codesign=1 du preset : sans elle, Apple Silicon refuse net le
          # binaire ; le clic droit → Ouvrir ne lève que Gatekeeper).
          if "$G" --headless --path . --export-release "macOS" \
                builds/macos/EclatsDOrage.zip; then
            write_readme builds/macos/LISEZ_MOI.txt "macOS" "1. Décompresser l'archive.\n2. CLIC DROIT sur EclatsDOrage.app puis « Ouvrir », et confirmer.\n\nUn double-clic ordinaire sera REFUSÉ la première fois : l'application\nn'est pas signée par Apple, faute de compte développeur. Ce n'est pas un\ndéfaut du jeu, et le clic droit ne sert qu'une seule fois."
            # Le bundle exporté porte le nom du projet (« Eclats d'Orage.app »,
            # espace et apostrophe compris) ; la livraison exige
            # EclatsDOrage.app. Renommer le DOSSIER du bundle ne touche pas la
            # signature ad hoc : le sceau couvre le contenu, pas le nom.
            R="$(mktemp -d)"
            unzip -q builds/macos/EclatsDOrage.zip -d "$R"
            APP_SRC="$(find "$R" -maxdepth 1 -name "*.app" | head -1)"
            [ -n "$APP_SRC" ] || { echo "macOS : aucun .app dans le zip"; exit 1; }
            mv "$APP_SRC" "$R/EclatsDOrage.app"
            cp builds/macos/LISEZ_MOI.txt "$R/"
            ( cd "$R" && zip -qry \
                "$GITHUB_WORKSPACE/builds/EclatsDOrage_macOS_${STAMP}.zip" \
                EclatsDOrage.app LISEZ_MOI.txt )
            rm -rf "$R" builds/macos/EclatsDOrage.zip
            echo "macOS : exporté (bundle renommé EclatsDOrage.app)"
          else
            echo "macOS : ÉCHEC (les autres cibles continuent)"
          fi

          # Web — priorite 1 du checkpoint d'Istvan : partageable sans rien
          # installer. Godot FORCE le renderer Compatibility sur cette cible —
          # `rendering/renderer/rendering_method.web` vaut `gl_compatibility`
          # par defaut et son enum ne contient que cette valeur (verifie dans
          # main/main.cpp du moteur installe). Le jeu demarre donc, mais SANS
          # fog volumetrique, SDFGI, SSIL ni SSR : c'est la limite annoncee par
          # MASTER_SPEC §5.2, pas une regression.
          #
          # L'export Web produit une DIZAINE de fichiers (html, js, wasm, pck,
          # png). On zippe le repertoire entier : ouvrir index.html seul ne
          # donne rien.
          mkdir -p builds/web
          if "$G" --headless --path . --export-release "Web" \
                builds/web/index.html; then
            write_readme builds/web/LISEZ_MOI.txt "Navigateur (Web)" "1. Decompresser l'archive.\n2. Ouvrir un terminal DANS le dossier decompresse.\n3. Lancer :  python3 -m http.server 8000\n4. Ouvrir http://localhost:8000 dans Chrome ou Firefox.\n\nUn double-clic sur index.html NE MARCHE PAS : les navigateurs refusent\nde charger un jeu depuis un fichier local. Le petit serveur ci-dessus\nexiste pour ca, et il s'arrete avec Ctrl+C."
            ( cd builds/web && zip -qr \
                "../EclatsDOrage_Web_${STAMP}.zip" . )
            echo "Web : exporte ($(du -sh builds/web | cut -f1))"
          else
            echo "Web : ECHEC (les autres cibles continuent)"
          fi

          # Ne laisser que les ZIP dans builds/ : `rm -rf builds/<os>`
          # emporterait les `.gitkeep` SUIVIS, et le garde-fou de propreté
          # verrait « D ».
          rm -f builds/linux/EclatsDOrage.x86_64 builds/linux/LISEZ_MOI.txt \
                builds/windows/EclatsDOrage.exe builds/windows/LISEZ_MOI.txt \
                builds/macos/EclatsDOrage.zip builds/macos/LISEZ_MOI.txt
          find builds/web -mindepth 1 -not -name '.gitkeep' -delete 2>/dev/null || true
          ls -1 builds/*.zip 2>/dev/null || echo "aucun binaire produit"

      # macOS n'est PLUS un meilleur effort quand la livraison EST la version
      # macOS : l'app est décompressée et inspectée AVANT toute publication —
      # intégrité du ZIP, structure .app, exécutable Mach-O non vide, pack de
      # ressources présent, aucun pointeur Git LFS. Échec = pas de Release.
      - name: Vérifier l'application macOS (obligatoire en full_visual)
        if: steps.cible.outputs.selftest == 'false' && steps.cible.outputs.gm4 == 'false'
        run: |
          set -euo pipefail
          FULLVIS="${{ steps.cible.outputs.full_visual }}"
          ZIP="$(ls -1 builds/EclatsDOrage_macOS_*.zip 2>/dev/null | head -1 || true)"
          if [ -z "$ZIP" ]; then
            if [ "$FULLVIS" = "true" ]; then
              echo "ÉCHEC : livraison macOS demandée, aucun ZIP macOS produit"
              exit 1
            fi
            echo "macOS absent (meilleur effort) — on continue"
            exit 0
          fi
          unzip -t "$ZIP" >/dev/null
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          APP="$TMP/EclatsDOrage.app"
          [ -d "$APP/Contents/MacOS" ] || { echo "ÉCHEC : Contents/MacOS absent"; exit 1; }
          EXE="$(find "$APP/Contents/MacOS" -type f | head -1)"
          { [ -n "$EXE" ] && [ -s "$EXE" ]; } || { echo "ÉCHEC : exécutable vide"; exit 1; }
          file "$EXE" | grep -qi "Mach-O" || { echo "ÉCHEC : pas un Mach-O : $(file "$EXE")"; exit 1; }
          PCK="$(find "$APP/Contents/Resources" -name "*.pck" -size +1M 2>/dev/null | head -1 || true)"
          [ -n "$PCK" ] || { echo "ÉCHEC : aucun .pck de ressources dans l'app"; exit 1; }
          if grep -rIl "git-lfs.github.com" "$APP" >/dev/null 2>&1; then
            echo "ÉCHEC : pointeur Git LFS embarqué dans l'app"
            exit 1
          fi
          echo "app vérifiée : zip $(du -h "$ZIP" | cut -f1), exécutable $(du -h "$EXE" | cut -f1) ($(file -b "$EXE")), pck $(du -h "$PCK" | cut -f1)"
          rm -rf "$TMP"

      # Une archive qui ne se décompresse pas est pire qu'une absence
      # d'archive : elle se découvre chez celui qui la télécharge.
      - name: Vérifier l'archive et calculer son empreinte
        id: paquet
        run: |
          set -euo pipefail
          # `|| true` : avec pipefail, un `ls` dont UN des deux motifs ne
          # matche rien (cas normal — on produit l'un OU l'autre) sort en 2
          # et tuait l'étape. Le garde-fou "aucune archive" suffit derrière.
          ZIP="$(ls -1 builds/Projet_Godot_WorldV2_R2a_GM4_*.zip builds/EclatsDOrage_MondeOuvert_*.zip builds/EclatsDOrage_SelfTest_*.zip 2>/dev/null | head -1 || true)"
          [ -n "$ZIP" ] || { echo "aucune archive produite"; exit 1; }
          unzip -t "$ZIP"
          sha256sum "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"
          NAME="$(basename "$ZIP")"
          SUM="$(cat "${ZIP}.sha256")"
          SIZE="$(du -h "$ZIP" | cut -f1)"
          BYTES="$(stat -c%s "$ZIP")"
          {
            echo "zip=$ZIP"
            echo "name=$NAME"
            echo "sha256=$SUM"
            echo "size=$SIZE"
            echo "bytes=$BYTES"
          } >> "$GITHUB_OUTPUT"
          echo "archive : $NAME ($SIZE, $BYTES octets)"
          echo "sha256  : $SUM"

      # Garde-fou explicite : rien de ce qui vient d'être produit ne doit
      # pouvoir entrer dans Git, même par accident d'un futur `git add -A`.
      - name: L'archive n'entre pas dans le dépôt
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain)"
          if [ -n "$DIRTY" ]; then
            echo "des artefacts de build sont visibles par Git :"
            echo "$DIRTY"
            echo "→ compléter .gitignore avant de publier"
            exit 1
          fi
          echo "arbre propre : l'archive reste hors du dépôt"

      - name: Créer la Release et téléverser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cible.outputs.tag }}"
          COMMIT="${{ steps.cible.outputs.commit }}"
          NOTES="$(mktemp)"
          {
            echo "Archive jouable d'Éclats d'Orage, construite à partir du"
            echo "commit \`${COMMIT}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`${{ steps.paquet.outputs.name }}\` |"
            echo "| Taille | ${{ steps.paquet.outputs.size }} (${{ steps.paquet.outputs.bytes }} octets) |"
            echo "| SHA-256 | \`${{ steps.paquet.outputs.sha256 }}\` |"
            echo "| Commit | \`${COMMIT}\` |"
            echo "| Moteur requis | Godot **4.7.1-stable**, édition standard |"
            echo
            echo "### Lancer"
            echo
            echo "1. Décompresser l'archive."
            echo "2. Ouvrir Godot 4.7.1-stable, **Importer**, choisir le \`project.godot\`."
            echo "3. Attendre le premier import (plusieurs minutes, une seule fois), puis **F5**."
            echo
            echo "Détails, commandes AZERTY et limites connues : \`COMMENT_JOUER.md\`"
            echo "à la racine de l'archive."
          } > "$NOTES"
          # `--target` crée le tag s'il n'existe pas encore, sur CE commit.
          ASSETS=( "${{ steps.paquet.outputs.zip }}" \
                   "${{ steps.paquet.outputs.zip }}.sha256" )
          # Les trois binaires autonomes, chacun avec son empreinte. Chaque
          # cible est indépendante : celle qui manque ne prive pas les autres.
          FOUND_BIN=false
          for BIN_ZIP in builds/EclatsDOrage_Windows_x86_64_*.zip \
                         builds/EclatsDOrage_macOS_*.zip \
                         builds/EclatsDOrage_Linux_x86_64_*.zip; do
            [ -f "$BIN_ZIP" ] || continue
            sha256sum "$BIN_ZIP" | awk '{print $1}' > "$BIN_ZIP.sha256"
            ASSETS+=( "$BIN_ZIP" "$BIN_ZIP.sha256" )
            if [ "$FOUND_BIN" = false ]; then
              FOUND_BIN=true
              {
                echo
                echo "### Jeu autonome — prenez celui de VOTRE système"
                echo
                echo "Aucune installation, aucun Godot à télécharger : le jeu est"
                echo "dans le fichier."
                echo
                echo "| Système | Fichier | SHA-256 |"
                echo "|---|---|---|"
              } >> "$NOTES"
            fi
            case "$(basename "$BIN_ZIP")" in
              *Windows*) OS_LABEL="Windows 64 bits" ;;
              *macOS*)   OS_LABEL="macOS" ;;
              *Linux*)   OS_LABEL="Linux x86_64" ;;
              *)         OS_LABEL="?" ;;
            esac
            echo "| $OS_LABEL | \`$(basename "$BIN_ZIP")\` | \`$(cat "$BIN_ZIP.sha256")\` |" >> "$NOTES"
          done
          if [ "$FOUND_BIN" = true ]; then
            {
              echo
              echo "**Windows** — décompresser, double-cliquer sur \`EclatsDOrage.exe\`."
              echo
              echo "**macOS** — décompresser, puis **clic droit sur l'application →"
              echo "Ouvrir**, et confirmer. Un double-clic ordinaire sera refusé :"
              echo "l'application n'est pas signée par Apple, faute de compte"
              echo "développeur. Ce n'est pas un défaut du jeu."
              echo
              echo "**Linux** — décompresser, \`chmod +x EclatsDOrage.x86_64\`, lancer."
            } >> "$NOTES"
          fi
          # Livraison « Full World Visual Finish » : titre du propriétaire,
          # guide joueur et sommes de contrôle regroupées. Les fichiers
          # générés vivent dans $RUNNER_TEMP — jamais dans l'arbre Git.
          TITLE="Éclats d'Orage — archive jouable ($TAG)"
          if [ "${{ steps.cible.outputs.full_visual }}" = "true" ]; then
            TITLE="Éclats d'Orage — Full World Visual Finish ${{ steps.cible.outputs.short }}"
            if [ -f docs/GUIDE_JOUEUR.md ]; then
              cp docs/GUIDE_JOUEUR.md "$RUNNER_TEMP/GUIDE_JOUEUR.md"
              ASSETS+=( "$RUNNER_TEMP/GUIDE_JOUEUR.md" )
            fi
          fi
          : > "$RUNNER_TEMP/SHA256SUMS.txt"
          for A in "${ASSETS[@]}"; do
            case "$A" in
              *.zip)
                ( cd "$(dirname "$A")" && sha256sum "$(basename "$A")" ) \
                  >> "$RUNNER_TEMP/SHA256SUMS.txt" ;;
            esac
          done
          ASSETS+=( "$RUNNER_TEMP/SHA256SUMS.txt" )
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --target "$COMMIT" \
            "${ASSETS[@]}"

      # Créer n'est pas publier : on relit la Release pour constater que les
      # deux assets y sont réellement, et que le tag pointe sur le bon commit.
      - name: Vérifier la Release publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cible.outputs.tag }}"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) octets"'
          COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          [ "$COUNT" -ge 2 ] || { echo "assets manquants ($COUNT)"; exit 1; }
          # `commits/<ref>` déréférence le tag jusqu'au commit, qu'il soit
          # léger ou annoté — `git/ref/tags` renverrait l'objet tag lui-même.
          TAGGED="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" \
            --jq '.sha')"
          echo "tag $TAG -> $TAGGED"
          [ "$TAGGED" = "${{ steps.cible.outputs.commit }}" ] \
            || { echo "le tag ne pointe pas sur le commit publié"; exit 1; }
          echo
          echo "Lien direct :"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${{ steps.paquet.outputs.name }}"
          MAC="$(gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep '^EclatsDOrage_macOS_' | head -1 || true)"
          if [ -n "$MAC" ]; then
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MAC}"
          fi
