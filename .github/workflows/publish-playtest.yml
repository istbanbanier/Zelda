# Publication de l'archive jouable en GitHub Release.
#
# Pourquoi un workflow plutôt qu'un dépôt de fichier : l'archive pèse quelques
# centaines de mégaoctets. Une Release accepte 2 Gio par asset, le dépôt Git
# non — et une archive committée pollue l'historique à jamais. Le ZIP est donc
# CONSTRUIT ici, à partir du commit publié, et n'entre jamais dans Git.
#
# Deux façons de déclencher, une seule sémantique : « publie CE commit ».
#
#  1. `push` d'un tag `playtest-*` — le mode nominal.
#  2. `workflow_dispatch` — nécessaire ici : le mandataire Git du conteneur de
#     développement n'autorise que la branche de travail et refuse les refs de
#     tag (HTTP 403). Le tag ne peut donc pas être poussé depuis la machine
#     qui valide. Dans ce mode le workflow CRÉE le tag `playtest-<short_sha>`
#     sur le commit qu'il vient de construire : le tag pointe toujours
#     exactement sur le commit publié, et l'archive reste reconstructible.
name: Publier l'archive jouable

on:
  push:
    tags:
      - 'playtest-*'
  workflow_dispatch:
    inputs:
      selftest:
        description: >-
          Publier un paquet minimal au lieu du jeu, pour éprouver les
          permissions de Release sans transporter 400 Mo.
        type: boolean
        default: false

# Le minimum pour créer une Release et y téléverser des assets.
permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le commit à publier
        uses: actions/checkout@v4

      # Le tag est déduit, jamais inventé : soit c'est celui qui a déclenché le
      # workflow, soit il est construit sur l'empreinte courte du commit
      # réellement présent dans le runner.
      - name: Déterminer le tag et le mode
        id: cible
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              playtest-selftest*) SELFTEST=true ;;
              *)                  SELFTEST=false ;;
            esac
          else
            SELFTEST="${{ inputs.selftest }}"
            if [ "$SELFTEST" = "true" ]; then
              TAG="playtest-selftest-${SHORT}"
            else
              TAG="playtest-${SHORT}"
            fi
          fi
          {
            echo "commit=$COMMIT"
            echo "short=$SHORT"
            echo "tag=$TAG"
            echo "selftest=$SELFTEST"
          } >> "$GITHUB_OUTPUT"
          echo "commit   : $COMMIT"
          echo "tag      : $TAG"
          echo "selftest : $SELFTEST"

      - name: Construire l'archive jouable
        if: steps.cible.outputs.selftest == 'false'
        run: |
          set -euo pipefail
          bash tools/make_playable_zip.sh

      # Un paquet minimal ne sert qu'à prouver que les permissions de Release
      # fonctionnent : éprouver la plomberie ne demande pas de transporter le
      # jeu entier.
      - name: Construire un paquet minimal (auto-test)
        if: steps.cible.outputs.selftest == 'true'
        run: |
          set -euo pipefail
          STAMP="${{ steps.cible.outputs.short }}"
          mkdir -p "builds/selftest_${STAMP}"
          {
            echo "# Auto-test de publication"
            echo
            echo "Paquet minimal produit pour vérifier que le workflow sait"
            echo "créer une Release et y téléverser un asset. Il ne contient"
            echo "PAS le jeu. Commit : ${{ steps.cible.outputs.commit }}"
          } > "builds/selftest_${STAMP}/LISEZ_MOI.md"
          ( cd builds && zip -qr "EclatsDOrage_SelfTest_${STAMP}.zip" \
              "selftest_${STAMP}" )
          rm -rf "builds/selftest_${STAMP}"

      # Binaires autonomes (Phase I, §25.1 « build natif disponible »).
      #
      # S2.1 : TROIS cibles au lieu d'une. Le propriétaire ne sait pas quel
      # système il utilise ; on publie donc Windows, macOS et Linux, et il
      # prend celle qui démarre. Un runner Linux exporte les trois : les
      # templates sont fournis pour toutes les plateformes dans le même .tpz.
      #
      # MEILLEUR EFFORT, cible par cible : le runner télécharge le Godot
      # officiel et ses templates — impossible depuis le conteneur de
      # développement, dont le proxy refuse godotengine.org (403). L'échec
      # d'UNE cible ne doit ni empêcher les deux autres, ni empêcher la
      # publication de l'archive source. D'où le `continue-on-error` sur
      # l'étape et le `|| true` sur chaque export.
      - name: Exporter les binaires autonomes (meilleur effort)
        if: steps.cible.outputs.selftest == 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          VER=4.7.1
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VER}-stable"
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${VER}-stable_linux.x86_64.zip"
          curl -fsSL -o /tmp/tpl.tpz "$BASE/Godot_v${VER}-stable_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x "/tmp/Godot_v${VER}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VER}.stable"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${VER}.stable/"
          G="/tmp/Godot_v${VER}-stable_linux.x86_64"
          "$G" --headless --path . --import || true
          STAMP="${{ steps.cible.outputs.short }}"
          mkdir -p builds/linux builds/windows builds/macos

          # Linux — exécutable nu.
          if "$G" --headless --path . --export-release "Linux x86_64" \
                builds/linux/EclatsDOrage.x86_64; then
            ( cd builds/linux && zip -q \
                "../EclatsDOrage_Linux_x86_64_${STAMP}.zip" EclatsDOrage.x86_64 )
            echo "Linux : exporté"
          else
            echo "Linux : ÉCHEC (les autres cibles continuent)"
          fi

          # Windows — .exe autonome, PCK embarqué.
          if "$G" --headless --path . --export-release "Windows Desktop" \
                builds/windows/EclatsDOrage.exe; then
            ( cd builds/windows && zip -q \
                "../EclatsDOrage_Windows_x86_64_${STAMP}.zip" EclatsDOrage.exe )
            echo "Windows : exporté"
          else
            echo "Windows : ÉCHEC (les autres cibles continuent)"
          fi

          # macOS — .app empaquetée par Godot, NON SIGNÉE (voir notes).
          if "$G" --headless --path . --export-release "macOS" \
                builds/macos/EclatsDOrage.zip; then
            mv builds/macos/EclatsDOrage.zip \
               "builds/EclatsDOrage_macOS_${STAMP}.zip"
            echo "macOS : exporté"
          else
            echo "macOS : ÉCHEC (les autres cibles continuent)"
          fi

          # Ne laisser que les ZIP dans builds/ : `rm -rf builds/<os>`
          # emporterait les `.gitkeep` SUIVIS, et le garde-fou de propreté
          # verrait « D ».
          rm -f builds/linux/EclatsDOrage.x86_64 \
                builds/windows/EclatsDOrage.exe \
                builds/macos/EclatsDOrage.zip
          ls -1 builds/*.zip 2>/dev/null || echo "aucun binaire produit"

      # Une archive qui ne se décompresse pas est pire qu'une absence
      # d'archive : elle se découvre chez celui qui la télécharge.
      - name: Vérifier l'archive et calculer son empreinte
        id: paquet
        run: |
          set -euo pipefail
          # `|| true` : avec pipefail, un `ls` dont UN des deux motifs ne
          # matche rien (cas normal — on produit l'un OU l'autre) sort en 2
          # et tuait l'étape. Le garde-fou "aucune archive" suffit derrière.
          ZIP="$(ls -1 builds/EclatsDOrage_MondeOuvert_*.zip builds/EclatsDOrage_SelfTest_*.zip 2>/dev/null | head -1 || true)"
          [ -n "$ZIP" ] || { echo "aucune archive produite"; exit 1; }
          unzip -t "$ZIP"
          sha256sum "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"
          NAME="$(basename "$ZIP")"
          SUM="$(cat "${ZIP}.sha256")"
          SIZE="$(du -h "$ZIP" | cut -f1)"
          BYTES="$(stat -c%s "$ZIP")"
          {
            echo "zip=$ZIP"
            echo "name=$NAME"
            echo "sha256=$SUM"
            echo "size=$SIZE"
            echo "bytes=$BYTES"
          } >> "$GITHUB_OUTPUT"
          echo "archive : $NAME ($SIZE, $BYTES octets)"
          echo "sha256  : $SUM"

      # Garde-fou explicite : rien de ce qui vient d'être produit ne doit
      # pouvoir entrer dans Git, même par accident d'un futur `git add -A`.
      - name: L'archive n'entre pas dans le dépôt
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain)"
          if [ -n "$DIRTY" ]; then
            echo "des artefacts de build sont visibles par Git :"
            echo "$DIRTY"
            echo "→ compléter .gitignore avant de publier"
            exit 1
          fi
          echo "arbre propre : l'archive reste hors du dépôt"

      - name: Créer la Release et téléverser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cible.outputs.tag }}"
          COMMIT="${{ steps.cible.outputs.commit }}"
          NOTES="$(mktemp)"
          {
            echo "Archive jouable d'Éclats d'Orage, construite à partir du"
            echo "commit \`${COMMIT}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`${{ steps.paquet.outputs.name }}\` |"
            echo "| Taille | ${{ steps.paquet.outputs.size }} (${{ steps.paquet.outputs.bytes }} octets) |"
            echo "| SHA-256 | \`${{ steps.paquet.outputs.sha256 }}\` |"
            echo "| Commit | \`${COMMIT}\` |"
            echo "| Moteur requis | Godot **4.7.1-stable**, édition standard |"
            echo
            echo "### Lancer"
            echo
            echo "1. Décompresser l'archive."
            echo "2. Ouvrir Godot 4.7.1-stable, **Importer**, choisir le \`project.godot\`."
            echo "3. Attendre le premier import (plusieurs minutes, une seule fois), puis **F5**."
            echo
            echo "Détails, commandes AZERTY et limites connues : \`COMMENT_JOUER.md\`"
            echo "à la racine de l'archive."
          } > "$NOTES"
          # `--target` crée le tag s'il n'existe pas encore, sur CE commit.
          ASSETS=( "${{ steps.paquet.outputs.zip }}" \
                   "${{ steps.paquet.outputs.zip }}.sha256" )
          # Les trois binaires autonomes, chacun avec son empreinte. Chaque
          # cible est indépendante : celle qui manque ne prive pas les autres.
          FOUND_BIN=false
          for BIN_ZIP in builds/EclatsDOrage_Windows_x86_64_*.zip \
                         builds/EclatsDOrage_macOS_*.zip \
                         builds/EclatsDOrage_Linux_x86_64_*.zip; do
            [ -f "$BIN_ZIP" ] || continue
            sha256sum "$BIN_ZIP" | awk '{print $1}' > "$BIN_ZIP.sha256"
            ASSETS+=( "$BIN_ZIP" "$BIN_ZIP.sha256" )
            if [ "$FOUND_BIN" = false ]; then
              FOUND_BIN=true
              {
                echo
                echo "### Jeu autonome — prenez celui de VOTRE système"
                echo
                echo "Aucune installation, aucun Godot à télécharger : le jeu est"
                echo "dans le fichier."
                echo
                echo "| Système | Fichier | SHA-256 |"
                echo "|---|---|---|"
              } >> "$NOTES"
            fi
            case "$(basename "$BIN_ZIP")" in
              *Windows*) OS_LABEL="Windows 64 bits" ;;
              *macOS*)   OS_LABEL="macOS" ;;
              *Linux*)   OS_LABEL="Linux x86_64" ;;
              *)         OS_LABEL="?" ;;
            esac
            echo "| $OS_LABEL | \`$(basename "$BIN_ZIP")\` | \`$(cat "$BIN_ZIP.sha256")\` |" >> "$NOTES"
          done
          if [ "$FOUND_BIN" = true ]; then
            {
              echo
              echo "**Windows** — décompresser, double-cliquer sur \`EclatsDOrage.exe\`."
              echo
              echo "**macOS** — décompresser, puis **clic droit sur l'application →"
              echo "Ouvrir**, et confirmer. Un double-clic ordinaire sera refusé :"
              echo "l'application n'est pas signée par Apple, faute de compte"
              echo "développeur. Ce n'est pas un défaut du jeu."
              echo
              echo "**Linux** — décompresser, \`chmod +x EclatsDOrage.x86_64\`, lancer."
            } >> "$NOTES"
          fi
          gh release create "$TAG" \
            --title "Éclats d'Orage — archive jouable ($TAG)" \
            --notes-file "$NOTES" \
            --target "$COMMIT" \
            "${ASSETS[@]}"

      # Créer n'est pas publier : on relit la Release pour constater que les
      # deux assets y sont réellement, et que le tag pointe sur le bon commit.
      - name: Vérifier la Release publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cible.outputs.tag }}"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) octets"'
          COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          [ "$COUNT" -ge 2 ] || { echo "assets manquants ($COUNT)"; exit 1; }
          # `commits/<ref>` déréférence le tag jusqu'au commit, qu'il soit
          # léger ou annoté — `git/ref/tags` renverrait l'objet tag lui-même.
          TAGGED="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" \
            --jq '.sha')"
          echo "tag $TAG -> $TAGGED"
          [ "$TAGGED" = "${{ steps.cible.outputs.commit }}" ] \
            || { echo "le tag ne pointe pas sur le commit publié"; exit 1; }
          echo
          echo "Lien direct :"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${{ steps.paquet.outputs.name }}"
