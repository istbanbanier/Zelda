; ── S3 — cible Web, ajoutée pour le checkpoint jouable d'Istvan ────────────
;
; POURQUOI ELLE N'EXISTAIT PAS. Les trois presets ci-dessus sont des cibles
; natives ; le Web demande un renderer différent, et la question « faut-il
; forcer Compatibility ? » n'avait jamais été tranchée.
;
; ELLE EST TRANCHÉE, ET PAR LA SOURCE DU MOTEUR INSTALLÉ. `main/main.cpp` :
;
;   GLOBAL_DEF_RST_BASIC(PropertyInfo(Variant::STRING,
;       "rendering/renderer/rendering_method.web",
;       PROPERTY_HINT_ENUM, "gl_compatibility"), "gl_compatibility");
;       // This is a bit of a hack until we have WebGPU support.
;
; La surcharge `.web` vaut `gl_compatibility` PAR DÉFAUT, et son énumération ne
; contient que cette valeur. Godot force donc Compatibility sur le Web : il n'y
; a rien à écrire dans `project.godot`, et rien d'autre à choisir. Vérifié dans
; la source plutôt que supposé — MASTER_SPEC §0.5, « ne jamais halluciner une
; capacité de Godot ».
;
; CE QUE CELA IMPLIQUE, ET IL FAUT LE DIRE : le jeu est composé pour Forward+.
; Sur le Web il tournera en Compatibility, donc SANS fog volumétrique, SDFGI,
; SSIL ni SSR. Il DÉMARRE et se joue ; il ne ressemble pas au natif. C'est la
; limite que MASTER_SPEC §5.2 annonce depuis le début, pas une régression.
;
; `etc2_astc` est activé et `s3tc_bptc` désactivé : c'est l'inverse des cibles
; natives, et c'est ce que le Web exige. `project.godot` porte déjà
; `textures/vram_compression/import_etc2_astc=true`, sans quoi les textures
; sortiraient non compressées.
;
; `variant/thread_support=false` : le support des fils demande des en-têtes
; d'isolation cross-origin (COOP/COEP) que l'ouverture d'un simple fichier
; local ne fournit pas. Le désactiver rend l'archive lançable derrière un
; `python3 -m http.server`, ce que le guide de jeu demande au propriétaire.

[preset.3]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="source_assets/*, evidence/*, docs/*, tests/*, tools/*, experiments/*"
