; Presets d'export — écrits à la main, faute d'éditeur graphique dans ce
; conteneur headless. Ils sont VERSIONNÉS parce qu'un build reproductible ne
; peut pas dépendre d'un fichier généré sur le poste de quelqu'un
; (MASTER_SPEC §25.1).
;
; Les templates d'export ne sont PAS téléchargeables ici : godotengine.org est
; bloqué par le proxy sortant. Ils sont donc compilés depuis les sources
; présentes dans /opt/src/godot :
;
;   scons platform=linuxbsd target=template_release arch=x86_64
;
; puis déposés sous ~/.local/share/godot/export_templates/4.7.1.stable/.

