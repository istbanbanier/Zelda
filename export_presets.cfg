; Presets d'export — écrits à la main, faute d'éditeur graphique dans ce
; conteneur headless. Ils sont VERSIONNÉS parce qu'un build reproductible ne
; peut pas dépendre d'un fichier généré sur le poste de quelqu'un
; (MASTER_SPEC §25.1).
;
; Les templates d'export ne sont PAS téléchargeables ici : godotengine.org est
; bloqué par le proxy sortant. Ils sont donc compilés depuis les sources
; présentes dans /opt/src/godot :
;
;   scons platform=linuxbsd target=template_release arch=x86_64
;
; puis déposés sous ~/.local/share/godot/export_templates/4.7.1.stable/.

[preset.0]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="source_assets/*, evidence/*, docs/*, tests/*, tools/*, experiments/*"
export_path="builds/linux/EclatsDOrage.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
